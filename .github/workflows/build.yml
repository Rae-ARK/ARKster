name: Build APK

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Provisions a verified Gradle distribution via Gradle's official action instead of
    # relying on a pre-committed gradle-wrapper.jar (which this repo doesn't have yet).
    # This also generates/refreshes the wrapper files to match gradle-wrapper.properties.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1

    - name: Regenerate Gradle wrapper
      run: gradle wrapper --gradle-version 8.1.1

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      # Piped through tee so the full compiler/Gradle output survives into a file we
      # can upload on failure - previously this only ever went to the Actions log
      # itself, which requires a signed-in GitHub session to view, and the "Upload
      # Build Logs on failure" step below only grabbed build/reports and
      # build/outputs/logs, neither of which ever contains this step's stdout. The
      # default bash shell GitHub Actions uses for `run:` already sets `-o pipefail`,
      # so piping to tee here does NOT swallow gradlew's real exit code - the step
      # still fails correctly if the build fails.
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log

    # Debug builds now sign with the committed debug.keystore (see
    # app/build.gradle.kts's signingConfigs.debug) instead of AGP's old
    # implicit fallback to ~/.android/debug.keystore - which this runner,
    # fresh every job, would've regenerated with a brand new random key on
    # every single run. Every CI-built debug APK, and every local build from
    # that same debug.keystore, should now carry one identical signature.
    # Printed here as a plain log line, not a pass/fail check, so that's
    # directly verifiable from the Actions log instead of having to pull the
    # artifact down and run apksigner/keytool yourself to confirm it.
    - name: Print debug APK signing fingerprint
      run: |
        keytool -list -v \
          -keystore debug.keystore -storepass android -alias androiddebugkey \
          | grep -E "SHA1:|SHA256:"

    # From release: run the unit test suite as its own step/log, separate from
    # assembleDebug above.
    - name: Unit tests
      run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build-output.log

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: arkster-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Build Logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-output.log
          **/build/reports/
          **/build/outputs/logs/
